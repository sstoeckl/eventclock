name: pkgdown-dev

on:
  push:
    branches: [dev]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pkgdown-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: r-lib/actions/setup-r@v2
        with: { use-public-rspm: true }

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown
          needs: website

      - name: Build pkgdown site (dev)
        run: |
          Rscript -e 'pkgdown::build_site(new_process = FALSE, install = FALSE,
                        override = list(url = "https://www.sebastianstoeckl.com/eventclock/dev/"))'

      - name: Deploy to GitHub Pages (dev/ subfolder)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: docs/dev
          target-folder: dev
          clean: false
