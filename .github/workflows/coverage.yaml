name: coverage

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { use-public-rspm: true }
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      - name: Compute test coverage
        run: |
          cov <- covr::package_coverage(quiet = FALSE)
          pct <- covr::percent_coverage(cov)
          cat(sprintf("## Test coverage: %.1f%%\n\n", pct),
              file = Sys.getenv("GITHUB_STEP_SUMMARY"), append = TRUE)
          df <- covr::coverage_to_list(cov)
          for (f in names(df$filecoverage)) {
            cat(sprintf("- `%s`: %.1f%%\n", f, df$filecoverage[[f]]),
                file = Sys.getenv("GITHUB_STEP_SUMMARY"), append = TRUE)
          }
          print(cov)
        shell: Rscript {0}
